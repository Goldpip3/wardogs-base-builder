name = "wardogs-votes"
main = "vote-worker.js"
compatibility_date = "2024-11-01"

# Created with: wrangler kv namespace create VOTES
[[kv_namespaces]]
binding = "VOTES"
id = "366137c732974a1ca2242ffde5528479"

# ADMIN_TOKEN and VOTE_SALT are deliberately NOT here. They are set with
# `wrangler secret put`, which keeps them out of the repo. A value listed under
# [vars] would be committed in plain text and would also quietly override the
# secret of the same name.
